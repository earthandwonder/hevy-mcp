[project]
name = "hevy-mcp"
version = "0.1.0"
description = "MCP server for Hevy workout tracking"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
hevy-mcp = "hevy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hevy_mcp"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]
